name: CI

# Lancé sur chaque pull request vers main, et réutilisé par release.yml (workflow_call)
# pour que le code soit vérifié de la même façon avant de publier une version.
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Construit l'image sans la publier : attrape un Dockerfile cassé avant la fusion.
  # Les deux architectures sont construites ; l'app l'est une seule fois (voir Dockerfile),
  # donc pas d'émulation et le coût de la seconde architecture est négligeable.
  docker:
    name: Docker build (sans publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=stardew-helper
          cache-to: type=gha,mode=max,scope=stardew-helper
          provenance: false
